# Hardware Configuration Collector - Configuration File
# Format: key=value (simple shell-style)

# Output path for hardware configuration JSON
output_path=/var/lib/dgx_spark_management/clear_asset_information/hardware_inventory_collector/hardware_config.json

# Path to device identity JSON (from device_identity.py)
identity_path=/var/lib/dgx_spark_management/clear_asset_information/hardware_inventory_collector/device_identity.json

# Storage device filtering
include_loop_devices=false
include_rom_devices=true

# Network interface filtering
include_virtual_interfaces=true
